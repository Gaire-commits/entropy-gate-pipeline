# Permutation-entropy-free baseline: the SIP sweep with entropy absent everywhere (decided 2026-10-25).
#
# What does the pipeline achieve when permutation entropy is not in it at all? Every earlier with/without
# comparison (RESULTS.md, "Entropy ablation") is on IEX data, and the SIP sweep (notebook section 22) was never
# validly finished, so this is the entropy-free arm on the headline feed. Same universe, period, features,
# folds, models and costs as sip_sp500_multihour.yaml; only two things differ:
#   - no gate: the sweep is run without screen.parquet, so predictions carry no gate columns and the gate
#     comparison (Q1) is skipped;
#   - no entropy model: `gbm_ent` is dropped from the list. Entropy enters the pipeline only through the gate
#     and the `_ent` models (src/models.needs_entropy), so what remains never sees it.
# tests/test_configs.py checks both, and that every other block matches sip_sp500_multihour.yaml.
# Do not copy a screen.parquet into outputs/sip_pe_free/.
#
# Run (S&P 500 SIP bars, 503 stocks, CPU with High-RAM; the cache and its coverage guard are shared):
#   python scripts/sweep.py --config configs/sip_pe_free.yaml
#   python scripts/summarize.py --config configs/sip_pe_free.yaml
#
# PROTOCOL, fixed before any result (2026-10-25). Applied to outputs/sip_pe_free/summary.md:
#   1. BEATS COST: at least one model has a net 95% day-block interval above zero at the 2 bps headline cost.
#      Otherwise DOES NOT BEAT COST. Nothing is picked after seeing the table: every model in the list counts.
#   2. Reported, not decisive: gross and net at 0, 1, 2 and 5 bps, accuracy, and the most-confident 10%.
#   3. The effect of entropy is read later, never from this run alone: `gbm_ent` on the same rows, from
#      `python scripts/sweep.py --config configs/sip_sp500_multihour.yaml --archs gbm_ent`, against `gbm` here
#      (same folds, same samples). Until that run exists, the effect of entropy on SIP is not measured.
# Survivorship bias: today's S&P 500 list applied back to 2016.
experiment: sip_pe_free

data:
  universe: "universe/sp500.csv"   # resolved by src.data.resolve_universe
  # Alpaca's free IEX history begins in late July 2020; earlier years come back empty.
  start: "2016-01-04"        # SIP history; IEX's begins in July 2020
  # "today" tops the cache up to now; a fixed date (inclusive) pins it. A session still
  # in progress is dropped automatically, so running mid-day is safe.
  end: "yesterday"
  timeframe: "5Min"
  feed: "sip"             # free tier
  adjustment: "split"     # traded prices, so tick-size checks see real cents
  cache_dir: "data/bars_sip"   # never share a folder with the IEX bars

screening:
  embedding_dim: 4
  delay: 1
  window: 390             # 5 sessions of 5-min bars
  series: "log_return"
  n_surrogates: 99        # shuffled copies per reading; p-values resolve to 0.01
  min_bars_required: 300
  gate_statistic: "trend" # trend | entropy | entropy_weighted
  alpha: 0.05
  max_tie_fraction: 0.5
  min_ticks_per_bar: 6    # below ~6 cents a bar, rounding alone creates zig-zags
  seed: 0

features:
  # window + embargo + horizon must fit inside one 78-bar session (max start = 78-12-1-30 = 35).
  window: 12              # 1h of history -- the predictor
  embargo: 1              # execution lag: you cannot trade the bar you just read
  horizon: 30             # 2.5h forward return -- the target
  stride: 12              # new sample every hour -> 3 samples/day/symbol (0, 60, 120 min into the session)
  allow_overnight: false
  channels: [log_return, session_return, hl_range, volume_z]
  normalize: "fold_standardize"   # stats from the training fold only; keeps the trend visible
  label_deadzone: 0.0005  # training skips moves under 5 bps; the test set never does

model:
  epochs: 30
  patience: 5
  batch_size: 256
  lr: 0.001
  weight_decay: 0.0001
  dropout: 0.2

validation:
  train_days: 504         # ~2 years
  val_days: 63
  test_days: 63           # one quarter, retrained every quarter
  step_days: 63

sweep:
  # cnn1d/resnet1d/inceptiontime/resnet2d are opt-in here (--archs ...): at ~500
  # symbols x 3 samples/day, a full walk-forward sweep of the deep models is a much
  # bigger job than the 12-ETF configs -- see the multi-hour config's timing notes.
  # gbm/gbm_ent (trees, CPU, roughly 1-2 min per fold each) differ only by the entropy features;
  # resnet1d/resnet1d_ent are the deep pair, opt-in for the same reason as the other deep models.
  archs: [always_up, momentum_day, momentum_window, logreg, gbm]   # no `_ent` model: none sees an entropy feature
  seeds: [0, 1, 2]

evaluation:
  cost_bps: [0, 1, 2, 5]  # round trip; sector ETFs cross roughly 1-3 bps of spread
  headline_cost_bps: 2  # unchanged: still an intraday ETF round trip, just held longer
  bootstrap: 2000
  # re-score using only the most confident predictions; 1.0 keeps everything
  coverage_levels: [1.0, 0.5, 0.2, 0.1]
