# Entropy Gate Pipeline — central config.
# Every stage reads from here so experiments differ by config, not by edited code.

data:
  # Start small. Widen the universe once the screen is validated.
  universe: [AAPL, MSFT, NVDA, AMD, TSLA, AMZN, GOOGL, META, JPM, XOM,
             KO, PG, WMT, DIS, INTC, CSCO, PFE, BAC, T, VZ]
  start: "2024-01-01"
  end: "2025-06-30"
  timeframe: "5Min"        # 1Min | 5Min | 15Min | 1Hour | 1Day
  feed: "iex"              # free tier
  adjustment: "split"      # split | dividend | all | raw
  regular_hours_only: true # drop pre/post-market bars
  cache_dir: "data/bars"

screening:
  # Bandt-Pompe parameters. m=4..6 is the usual range for financial series;
  # need N >> m! samples per window for the pattern histogram to be meaningful.
  embedding_dim: 4
  delay: 1
  window: 390              # bars per screening window
  step: 78                 # bars between successive screens
  series: "log_return"     # log_return | price | signed_volume
  weighted: true           # Fadlallah weighted PE (amplitude-aware)
  tie_handling: "stable"   # stable | jitter
  # A symbol passes the gate when normalized PE sits below this quantile
  # of the cross-sectional distribution on that day.
  select_quantile: 0.30
  min_bars_required: 300

features:
  # window + embargo + horizon must fit inside one session (78 bars at 5Min),
  # or no intraday sample can be built at all.
  window: 48               # bars of history per training sample (4h at 5Min)
  horizon: 12              # bars held (1h at 5Min)
  embargo: 1               # execution lag: you cannot trade the bar you just read
  allow_overnight: false   # true lets a signal be filled the following session
  channels: [log_return, hl_range, close_open, volume_z]
  normalize: "window_zscore"   # per-window, in-window stats only
  # 1d feeds the sequence models; gaf/mtf produce LxL images for resnet2d and
  # cost L times the memory (48x at window=48), so watch RAM on wide universes.
  encoding: "1d"           # 1d | gaf | mtf
  label: "forward_return_sign"
  label_deadzone: 0.0005   # |fwd return| below this -> sample dropped (no-trade band)

model:
  # resnet2d requires features.encoding: gaf (or mtf); the rest require 1d.
  arch: "resnet1d"         # logreg | cnn1d | resnet1d | inceptiontime | resnet2d
  epochs: 30
  batch_size: 128
  lr: 0.001
  weight_decay: 0.0001
  dropout: 0.2
  seed: 42

validation:
  scheme: "walk_forward"
  train_days: 120
  val_days: 20
  test_days: 20
  step_days: 20
