# THE PORTFOLIO PROTOCOL, frozen 2026-11-02, before its reserved period was scored. Hash-checked by tests/test_frozen.py, along with
# the code that runs it. A change means a new, dated file with the reason in it, never an edit here.
#
# THE QUESTION. Does adding permutation entropy (PE) to an interpretable forecast of daily stock returns improve the forecast, and the
# portfolio built on it, net of costs? One primary test: `base_pe` against `base`. `base_pe_x` (three interactions fixed in advance) is secondary.
#
# THE PERIOD. Reserved window: decisions and returns from 2024-01-03 to 2026-10-12, shared with protocols/volatility_v1.yaml. It is
# RESERVED FOR THIS SPECIFICATION BUT PREVIOUSLY EXPOSED THROUGH RELATED RESEARCH; protocols/reserved_period_disclosure.md lists every prior use. It is
# not an untouched test. Only data after this protocol's date can be untouched.
#
# THE MODEL. Ridge on standardized features (src/portfolio.py: BASE, PE_FEATURE, INTERACTIONS), refit every 63 sessions on all realized rows, predicting
# each stock's cross-sectional rank in the next 21 sessions' return.
#
# THE RULES. Chosen on development and validation only (protocols/portfolio_rule_search_v2.yaml), on the PE-free model. Hold 21 sessions in 3 staggered
# tranches, one turning over every 7 sessions. Each tranche buys the best 20% of eligible stocks by forecast, equally weighted, and keeps a holding while it stays in
# the best 40%; no sector above 30% of a tranche's names. 24 candidates were seen in choosing this, and the choice's information ratio against equal-weight was
# -0.00 in development and +0.42 in validation, so expect selection bias in its favour on those windows.
#
# EXECUTION AND TARGET. Decided at the close of t, filled at the official close of t+1. The target runs from that fill to the fill 21 sessions later; a book
# reconciles to it to rounding error per tranche (src/portfolio.py: reconcile_target). A stock with no bar cannot be traded and keeps its weight.
#
# COSTS, fixed from evidence on trading costs, not from any strategy's results: 5 bp one-way on every dollar traded, plus square-root impact: daily volatility x
# sqrt(trade / daily dollar volume), on $10M. On development and validation this charged 8.4 bp per dollar traded, against about 9 bp average market impact
# (median about 6) in Frazzini, Israel and Moskowitz, "Trading Costs" (live institutional trades, https://papers.ssrn.com/abstract=3229719). Daily-bar
# spread estimators (Abdi and Ranaldo 2017) could not resolve spreads this small here: the estimate rose with dollar volume. Measured quotes are precondition 3.
#
# UNIVERSE AND ITS LIMIT. Today's S&P 500 list (fetched 2026-09-29), each stock only from its index-join date (registry/sp500_join_dates.csv; 3 without a date stay in).
# Raw close at least $5, trailing median dollar volume at least $10M, 90% of bars over a year. Companies since removed remain absent: survivorship inflates absolute
# returns by an unknown amount. Judge the book against equal-weight, which shares the bias, and read the IC first. Nothing here says the book beats the market.
#
# THE VERDICT, on the reserved window only, for each larger model against `base`:
#   FORECAST: Clark-West t >= 1.645 (one-sided 5%) AND the 95% interval of the IC gap above zero. Otherwise no improvement shown.
#   PORTFOLIO: the 95% interval of the net-return gap above zero. Otherwise no improvement shown.
# Primary is `base_pe`. Across the two protocols' primary tests a Holm correction is also reported; the verdicts above are the unadjusted ones.
#
# REPORTED, NOT DECISIVE: every metric against equal-weight and SPY (net return, Sharpe and Sortino over BIL, maximum drawdown, turnover, IC); the book's active return against
# equal-weight with its interval; other cost levels; the largest single-stock days; genuine extremes stay in (MRNA 2026-08-19 and others are known to exist, see the disclosure).
#
# PRECONDITIONS, run by scripts/protocol_checks.py, none of which scores anything. A failure stops the evaluation until an amendment, with its reason, is filed:
#   1. Alpaca's SPY and BIL match `benchmark_reference` below within 0.5% in every year.
#   2. At least 95% of vendor bars have an official open in every year (the volatility protocol's target).
#   3. The median quoted half-spread before the close, on sampled development and validation days, is at most the 5 bp assumed.
#
# RUN ONCE: python scripts/reserved_portfolio.py --reference <dir> --score-reserved. Before that flag, nothing after 2024-01-02 is loaded. Record the outcome in RESULTS.md whatever it is.
registered: "2026-11-02"
period: reserved for this specification but previously exposed through related research
rules:
  rebalance_every: 21
  horizon: 21
  tranches: 3
  top_frac: 0.20
  hold_frac: 0.40
  sector_cap: 0.30
  execution: next_close
  cost_bps: 5.0
  impact: 1.0
  aum: 10000000.0
  min_raw_close: 5.0
  min_dollar_volume: 10000000.0
  min_coverage: 0.9
  ridge: 0.01
  min_train_sessions: 504
  refit_every: 63
  train_sample_every: 5
  pe_m: 3
  pe_tau: 1
  pe_window: 63
  validation_start: "2022-01-04"
  holdout_start: "2024-01-03"
  holdout_end: "2026-10-12"
  seed: 0
# Calendar-year total returns from Yahoo's adjusted closes, retrieved 2026-11-02. SPY is within 0.3% of the S&P 500 total-return index in every year; BIL within 0.3% of
# FRED's 3-month T-bill (DTB3) in every year except 2022 (0.64% below, as rates rose).
benchmark_reference:
  SPY: {2017: 0.21705, 2018: -0.04569, 2019: 0.31224, 2020: 0.18332, 2021: 0.28729, 2022: -0.18175, 2023: 0.26176}
  BIL: {2017: 0.00689, 2018: 0.01737, 2019: 0.02032, 2020: 0.00399, 2021: -0.00098, 2022: 0.01405, 2023: 0.04945}
